; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = xiaoble

[env]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git
board = xiaoble
framework = arduino
build_flags =
    -Iinclude
    -Iinclude/config
    -Wl,--allow-multiple-definition
# Enable unit tests to include source files from src/ in every environment.
test_build_src = true

[env:xiaoble]
build_flags =
    ${env.build_flags}
    -DUSE_MOCK_SENSOR=0
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    khoih-prog/NRF52_MBED_TimerInterrupt @ ^1.4.1
# Real hardware environment: ignore the mock sensor tests only.
test_ignore = test_mock_sensor

[env:mock]
build_flags =
    ${env.build_flags}
    -DUSE_MOCK_SENSOR=1
lib_deps =
    khoih-prog/NRF52_MBED_TimerInterrupt @ ^1.4.1
# Mock environment: exclude only the real IMU driver implementation.
build_src_filter = +<*> -<drivers/Mpu6050Sensor.cpp>
# Mock environment: ignore only hardware-specific sensor tests.
test_ignore = test_hardware_sensor